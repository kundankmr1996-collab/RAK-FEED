
name: Build RAK FEED APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"

      - name: Extract project ZIP
        run: |
          unzip RAK_FEED_Android_Starter_with_APK_Build.zip -d buildsrc

      - name: Build APK
        run: |
          cd buildsrc/RAK_FEED_Android_Starter
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RAK-FEED-APK
          path: buildsrc/RAK_FEED_Android_Starter/app/build/outputs/apk/debug/app-debug.apk
