
name: Build RAK FEED APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        run: |
          unzip RAK_FEED_Android_Starter_with_APK_Build.zip -d buildsrc

      - name: Build APK
        run: |
          cd buildsrc/RAK_FEED_Android_Starter
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RAK-FEED-APK
          path: buildsrc/RAK_FEED_Android_Starter/app/build/outputs/apk/debug/app-debug.apk
